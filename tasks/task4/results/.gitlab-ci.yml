stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_NAME: booking-service
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  RELEASE: booking-service
  VALUES_FILE: values-staging.yaml
  SMOKE_CONTAINER: booking-service-smoke
  SMOKE_PORT: "18080"

build:
  stage: build
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" booking-service

unit-tests:
  stage: test
  script:
    - docker build --target test booking-service

test:
  stage: test
  needs: [build]
  script:
    - docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
    - docker run -d --name "$SMOKE_CONTAINER" -p "$SMOKE_PORT:8080" "$IMAGE_NAME:$IMAGE_TAG"
    - for i in $(seq 1 20); do curl -fs "http://localhost:$SMOKE_PORT/ping" >/dev/null && break; sleep 1; done
    - test "$(curl -fs "http://localhost:$SMOKE_PORT/ping")" = "pong"
    - echo "/ping -> pong"
  after_script:
    - docker rm -f "$SMOKE_CONTAINER"

deploy:
  stage: deploy
  script:
    - minikube image load "$IMAGE_NAME:$IMAGE_TAG"
    - helm upgrade --install "$RELEASE" helm/booking-service -f "helm/booking-service/$VALUES_FILE" --set image.tag="$IMAGE_TAG" --wait --timeout 3m
    - kubectl rollout status deployment/"$RELEASE" --timeout 2m

tag:
  stage: tag
  script:
    - TAG="$RELEASE-$(date -u +%Y%m%d%H%M%S)"
    - git tag "$TAG"
    - echo "created git tag $TAG"

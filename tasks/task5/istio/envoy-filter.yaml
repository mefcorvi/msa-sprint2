apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-feature-flag
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
      patch:
        operation: INSERT_FIRST
        value:
          name: hotelio.feature-flag
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(request)
                  local headers = request:headers()
                  headers:remove("x-booking-version")
                  if headers:get("x-feature-enabled") == "true" then
                    headers:add("x-booking-version", "v2")
                  end
                  request:clearRouteCache()
                end

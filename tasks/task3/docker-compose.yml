services:
  apollo-gateway:
    build: ./gateway
    container_name: apollo-gateway
    restart: on-failure
    ports:
      - "4000:4000"
    depends_on:
      - booking-subgraph
      - hotel-subgraph
    networks:
      - hotelio-net

  booking-subgraph:
    build:
      # context is tasks/: the shared contract lives in tasks/task2/booking.proto
      context: ..
      dockerfile: task3/booking-subgraph/Dockerfile
    container_name: booking-subgraph
    ports:
      - "4001:4001"
    environment:
      BOOKING_SERVICE_ADDR: booking-service:9090
    networks:
      - hotelio-net

  hotel-subgraph:
    build: ./hotel-subgraph
    container_name: hotel-subgraph
    ports:
      - "4002:4002"
    environment:
      MONOLITH_URL: http://hotelio-monolith:8080
    networks:
      - hotelio-net

# booking-service and the monolith run in the task 2 stack on the same network.
networks:
  hotelio-net:
    external: true
